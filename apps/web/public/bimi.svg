<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.2" baseProfile="tiny-ps" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>botready.dev</title>
  <!--
    The sender avatar: the mark with two things taken out.

    BIMI's profile is SVG Tiny Portable/Secure — version 1.2, baseProfile
    tiny-ps, a title, a square viewBox, absolute pixel width and height (Gmail
    asks for at least 96; this is 512), and no script, animation, external
    reference or raster data.

    Full-bleed violet with no rounded corners and no ink border, because every
    client that shows this crops it to a circle: the plate's radius would be
    cropped away and its border would survive as a thin dark rim down one side.
    The glyph itself is identical to app/icon.svg and sits well inside the
    inscribed circle.
  -->
  <rect width="512" height="512" fill="#4B44F5"/>
  <path d="M168 120V390" fill="none" stroke="#C6F53C" stroke-width="58" stroke-linecap="round"/>
  <circle cx="255" cy="305" r="92" fill="none" stroke="#C6F53C" stroke-width="54"/>
</svg>
