<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.2" baseProfile="tiny-ps" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>botready.dev</title>
  <!--
    The sender avatar, which is the favicon with three things taken out.

    BIMI's profile is SVG Tiny Portable/Secure: version 1.2, baseProfile
    tiny-ps, a title element, a square viewBox, and no script, animation,
    external reference or raster data. app/icon.svg breaks the last rule only
    by being a comment-heavy 32px drawing, so this is the same two paths at
    16x scale.

    Three deliberate differences from the favicon:

    - Full-bleed violet, no rounded corners. Every client that shows this crops
      it to a circle, so the 8.5px radius would be cropped away and the corners
      it protects do not exist.
    - No ink stroke around the edge. Same reason: a 2px border becomes a thin
      dark rim on one side of a circle.
    - The glyph is centred in the square rather than optically placed for a
      16px tab, because the safe area here is the inscribed circle.
  -->
  <rect width="512" height="512" fill="#4B44F5"/>
  <g fill="none" stroke="#C6F53C" stroke-width="54.4" stroke-linecap="round">
    <path d="M150 126V387"/>
    <circle cx="283" cy="307" r="80"/>
  </g>
</svg>
