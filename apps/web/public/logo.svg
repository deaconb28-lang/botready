<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>BotReady</title>
  <!-- The header mark. Kept in step with app/icon.svg.


    The mark, drawn rather than set: a favicon cannot wait on a web font, and
    a lowercase b at 16 pixels would be a smudge anyway.

    The same geometry is inlined in the Mark component in components/ui.tsx,
    in public/logo.svg and in public/bimi.svg. Next's icon convention needs
    this to be a literal .svg file, so the drawing exists more than once.
    Change them together.

    Heavier than the mark it replaced: a 58-unit stem and a 54-unit ring on a
    512 canvas, where the old one was a hairline on 32. The counter is
    correspondingly smaller at favicon size, which is the price of a bolder
    glyph and was the trade the logo made.
  -->
  <rect x="11" y="11" width="490" height="490" rx="132" fill="#4B44F5" stroke="#111318" stroke-width="22"/>
  <path d="M168 120V390" fill="none" stroke="#C6F53C" stroke-width="58" stroke-linecap="round"/>
  <circle cx="255" cy="305" r="92" fill="none" stroke="#C6F53C" stroke-width="54"/>
</svg>
